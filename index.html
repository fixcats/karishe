<!DOCTYPE html>
<html lang="ru">
<head><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С 14 февраля, Карина 💕</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #ffeef5, #ffeef5);
        text-align: center;
        color: #5a3e4b;
        overflow-x: hidden;
    }

    .container {
        padding: 40px 20px;
    }

    h1 {
        font-size: 2.8em;
    }

    h2 {
        font-weight: normal;
        margin-bottom: 30px;
    }

    .card {
        background: white;
        max-width: 600px;
        margin: 30px auto;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    img {
        max-width: 250px;
        border-radius: 20px;
        margin: 15px 0;
    }

    button {
        background: #ff8fb1;
        border: none;
        padding: 12px 25px;
        border-radius: 25px;
        font-size: 16px;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #ff6f9f;
    }

    .hidden-message {
        display: none;
        margin-top: 20px;
        font-size: 18px;
    }

    footer {
        margin-top: 50px;
        font-size: 14px;
        opacity: 0.7;
    }

    /* Падающие сердечки */
    .heart {
    background: #ffeef5;
    position: fixed;
    display: block;
    image-rendering: auto;
    top: -40px;
    width: 25px;      /* размер сердечка */
    animation: fall linear infinite;
    pointer-events: none;
    z-index: -1;
    }





    @keyframes fall {
        to {
            transform: translateY(100vh);
        }
    }

    @media (max-height: 900px) {
        h1 { font-size: 34px; }
        h2 { font-size: 16px; }
        img { width: 170px; }
        .card { padding: 30px; }
    }
</style>
</head>

<body>

<div class="container">

    <h1>для люимого котака</h1>
    <h2>спасибо что ты есть <3</h2>

    <div class="card">
        <h3>US </h3>

        <img src="mi2.png" alt="Pusheen love">

        <p>
            я рад что встретил тебя котик, пусть дальше у нас все будет хорошо 💖
        </p>

        <button onclick="showMessage()">жми</button>

        <div class="hidden-message" id="message">
            очень люблю тебя <33
        </div>
    </div>

    <footer>
        for kotak
    </footer>

</div>

<script>
function showMessage() {
    document.getElementById("message").style.display = "block";
}


/* Генерация падающих сердечек */
function createHeart() {
    const heart = document.createElement("img");
    heart.src = "mi3.png";
    heart.classList.add("heart");

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = Math.random() * 4 + 3 + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
